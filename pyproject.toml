[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexways"
version = "0.1.0"
description = "OpenStreetMap ways as H3 cells: an H3-keyed lookup table of road class, bridges, tunnels, level, bearing and surface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Etienne Reichenbach" }]
keywords = ["openstreetmap", "h3", "gps", "telemetry", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "h3>=4.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "osmium>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hexways = "hexways.cli:main"

[project.urls]
Homepage = "https://github.com/retienne/hexways"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]  # zip(a, a[1:]) is the idiom for pairs; strict= adds nothing
