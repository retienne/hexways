[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexways"
version = "0.1.0"
description = "OpenStreetMap ways as H3 cells — a lookup table for enriching GPS telemetry with road class, bridges, tunnels and surface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Etienne Reichenbach" }]
keywords = ["openstreetmap", "h3", "gps", "telemetry", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "h3>=4.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "osmium>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
hexways = "hexways.cli:main"

[project.urls]
Homepage = "https://github.com/etienner/hexways"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
