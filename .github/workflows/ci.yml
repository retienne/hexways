name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check src tests
      - run: pytest -q
      # the fixture end to end through the console script, as a user would run it
      - run: hexways -q build --pbf tests/fixtures/crossing.osm --out /tmp/crossing && hexways stats /tmp/crossing
